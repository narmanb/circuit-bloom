name: Build Circuit Bloom Power Plant
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct generated equipment artwork
        run: |
          cat assets/generated/atlas.part0 assets/generated/atlas.part1 assets/generated/atlas.part2 | base64 -d > assets/powerplant_equipment_atlas.webp
          test "$(stat -c%s assets/powerplant_equipment_atlas.webp)" -gt 15000
      - name: Install Godot 4.4.1 and templates
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install /tmp/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK for Godot
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF2
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF2
      - name: Import project and reject asset/script errors
        run: |
          set -o pipefail
          godot --headless --path . --editor --import --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E 'SCRIPT ERROR:|ERROR: (Error loading image|Error importing|Failed loading resource)' /tmp/godot-import.log; then
            echo 'Fatal Godot import/script error detected.' >&2
            exit 1
          fi
      - name: Headless simulation tests
        timeout-minutes: 3
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/run_tests.gd 2>&1 | tee /tmp/godot-tests.log
          if grep -E 'SCRIPT ERROR:|ERROR: (Error loading image|Error importing|Failed loading resource)' /tmp/godot-tests.log; then
            echo 'Fatal Godot test/script error detected.' >&2
            exit 1
          fi
          grep -q 'Circuit Bloom Power Plant tests: 24/24' /tmp/godot-tests.log
      - name: Validate main scene
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 5 2>&1 | tee /tmp/godot-scene.log
          if grep -E 'SCRIPT ERROR:|ERROR: (Error loading image|Error importing|Failed loading resource)' /tmp/godot-scene.log; then
            echo 'Fatal Godot scene/runtime error detected.' >&2
            exit 1
          fi
      - name: Export Android debug
        run: |
          set -o pipefail
          mkdir -p build
          base64 -d ci/debug.keystore.b64 > /tmp/circuit-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH=/tmp/circuit-debug.keystore GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android godot --headless --path . --export-debug Android build/CircuitBloom-PowerPlant-Android-debug.apk 2>&1 | tee /tmp/godot-export.log
          if grep -E 'SCRIPT ERROR:|ERROR: (Error loading image|Error importing|Failed loading resource)' /tmp/godot-export.log; then
            echo 'Fatal Godot export/script error detected.' >&2
            exit 1
          fi
          test -s build/CircuitBloom-PowerPlant-Android-debug.apk
      - name: Publish downloadable prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="powerplant-${GITHUB_SHA:0:12}"
          gh release create "$tag" build/CircuitBloom-PowerPlant-Android-debug.apk --target "$GITHUB_SHA" --title "Circuit Bloom Power Plant ${GITHUB_SHA:0:12}" --notes "Android debug APK for the power-plant prototype branch. CI rejects asset-import and GDScript failures before publishing." --prerelease
