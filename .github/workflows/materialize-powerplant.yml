name: Materialize power plant prototype

on:
  push:
    branches: [power-plant-prototype]
    paths:
      - 'ci/powerplant_payload/**'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: power-plant-prototype
      - name: Expand prototype payload
        run: |
          cat ci/powerplant_payload/chunk* > /tmp/powerplant_payload.b64
          base64 -d /tmp/powerplant_payload.b64 > /tmp/powerplant_payload.tar.xz
          tar -xJf /tmp/powerplant_payload.tar.xz -C .
      - name: Commit materialized Godot source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts tests project.godot export_presets.cfg README.md POWER_PLANT_PROTOTYPE.md .github/workflows/build.yml
          if git diff --cached --quiet; then
            echo "No source changes to materialize"
            exit 0
          fi
          git commit -m "Materialize power plant prototype source"
          git push origin HEAD:power-plant-prototype
